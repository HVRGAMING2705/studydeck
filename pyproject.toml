[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "studydeck_flashcards_quiz_app"
version = "0.1.0"
description = "A fully functional flashcards app that allows users to create decks, flip cards, and take quizzes. A working study app with decks, card flipping, and quiz scoring."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
